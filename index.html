<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primer Sitio Web</title>
    <style>
        /* Estilos CSS básicos y modernos */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 2rem;
        }

        main {
            flex: 1;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            text-align: center;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 1rem;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2980b9;
        }

        footer {
            text-align: center;
            padding: 1rem;
            background-color: #2c3e50;
            color: white;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>¡Bienvenido a mi sitio web!</h1>
        <p>Una página simple creada con HTML, CSS y JavaScript</p>
    </header>

    <main>
        <div class="card">
            <h2>Sección Principal</h2>
            <p>Este es un espacio de prueba. Puedes hacer clic en el botón de abajo para ver la interactividad en acción.</p>
            <button id="miBoton">¡Haz clic aquí!</button>
            <p id="mensaje" style="margin-top: 1rem; font-weight: bold; color: #27ae60;"></p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 - Creado con entusiasmo.</p>
    </footer>

    <script>
        // Código JavaScript para dar interactividad
        const boton = document.getElementById('miBoton');
        const mensaje = document.getElementById('mensaje');

        boton.addEventListener('click', function() {
            mensaje.textContent = '¡Gracias por hacer clic! JavaScript está funcionando correctamente.';
        });
    </script>

</body>
</html>
